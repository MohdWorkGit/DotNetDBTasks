services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: bayan-oracle
    environment:
      ORACLE_PASSWORD: "${DB_PASSWORD:-YourStrong@Passw0rd}"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
      - bayan-network
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: bayan-api
    environment:
      ConnectionStrings__DefaultConnection: "User Id=system;Password=${DB_PASSWORD:-YourStrong@Passw0rd};Data Source=oracle:1521/XEPDB1"
      Jwt__Secret: "${JWT_SECRET:-CHANGE_THIS_TO_A_SECURE_SECRET_KEY_AT_LEAST_32_CHARS_LONG_12345}"
      Jwt__Issuer: "${JWT_ISSUER:-Bayan}"
      Jwt__Audience: "${JWT_AUDIENCE:-Bayan}"
      Encryption__Key: "${ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}"
      Ldap__Host: "ldap"
      Ldap__Port: "389"
      Ldap__BaseDn: "dc=bayan,dc=local"
      Ldap__UsersDn: "ou=users,dc=bayan,dc=local"
      Ldap__AdminDn: "cn=admin,dc=bayan,dc=local"
      Ldap__AdminPassword: "${LDAP_ADMIN_PASSWORD:-LdapAdmin@123}"
      Ldap__UsernameAttribute: "uid"
      Ldap__DepartmentAttribute: "departmentNumber"
      Ldap__UserObjectFilter: "(objectClass=inetOrgPerson)"
      Cors__AllowedOrigins__0: "${APP_DOMAIN:-http://localhost}"
      Cors__AllowedOrigins__1: "http://client"
      ASPNETCORE_ENVIRONMENT: "Production"
    depends_on:
      oracle:
        condition: service_healthy
      ldap:
        condition: service_started
    networks:
      - bayan-network
    restart: unless-stopped

  ldap:
    image: osixia/openldap:1.5.0
    container_name: bayan-ldap
    environment:
      LDAP_ORGANISATION: "Bayan"
      LDAP_DOMAIN: "bayan.local"
      LDAP_ADMIN_PASSWORD: "${LDAP_ADMIN_PASSWORD:-LdapAdmin@123}"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
      - ./docker/ldap/bootstrap.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-bootstrap.ldif
    command: --copy-service
    networks:
      - bayan-network
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: docker/client.Dockerfile
    container_name: bayan-client
    ports:
      - "${CLIENT_PORT:-80}:80"
    depends_on:
      - api
    networks:
      - bayan-network
    restart: unless-stopped
    labels:
      - homepage.group=Manage
      - homepage.name=Bayan
      - homepage.icon=oracle.png
      - homepage.href=https://dbtasks.alharthy.uk/
      - homepage.description=Manage DB queries

volumes:
  oracle_data:
    driver: local
  ldap_data:
    driver: local
  ldap_config:
    driver: local

networks:
  bayan-network:
    driver: bridge
